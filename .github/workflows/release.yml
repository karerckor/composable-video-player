name: Release

# Publish a GitHub release tagged vX.Y.Z to publish that version to npm.
# Requires the NPM_TOKEN repository secret (npm automation / granular token with publish rights).
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag matches package.json version
        if: github.event_name == 'release'
        run: |
          test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")" \
            || { echo "Tag $GITHUB_REF_NAME does not match package.json version"; exit 1; }
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
